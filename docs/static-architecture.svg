<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Agent Hub V1 静态架构图</title>
  <desc id="desc">管理员、Web 用户和终端用户接入 Simple Admin Go 控制面。Go 控制面负责身份、RBAC、模型、Agent、工具、会话和审计，并通过 JSONL RPC 直接管理 Pi Runtime。Pi 对接 GLM 与 DeepSeek，并可通过受控扩展、MCP Client Extension 或 HTTP Adapter 连接第三方 RAG 和工具平台。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <style>
      .font{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.h1{font-size:34px;font-weight:750;fill:#0F172A}.subtitle{font-size:16px;fill:#64748B}.lane{font-size:15px;font-weight:700;fill:#334155;letter-spacing:1.5px}.title{font-size:20px;font-weight:700;fill:#0F172A}.title-light{font-size:20px;font-weight:700;fill:#FFF}.sub{font-size:14px;fill:#64748B}.sub-light{font-size:14px;fill:#E0E7FF}.item{font-size:15px;fill:#334155}.item-light{font-size:15px;fill:#F8FAFC}.small{font-size:13px;fill:#64748B}.label{font-size:13px;font-weight:650;fill:#475569}.chip{font-size:12px;font-weight:700;fill:#1E3A8A}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.line-blue{fill:none;stroke:#2563EB;stroke-width:2.5;marker-end:url(#arrowBlue)}.control-line{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1180" fill="url(#bg)"/>
  <g class="font">
    <text x="80" y="66" class="h1">Terminal Agent Hub · V1 静态架构</text>
    <text x="80" y="96" class="subtitle">Go 统一治理并直接管理 Pi Runtime；第三方 RAG 与工具通过受控连接器按需扩展</text>
    <g transform="translate(1210 52)"><line x1="0" y1="0" x2="52" y2="0" class="line-blue"/><text x="64" y="5" class="small">请求 / 流式数据</text><line x1="0" y1="28" x2="52" y2="28" class="control-line"/><text x="64" y="33" class="small">配置 / 控制</text></g>

    <text x="84" y="152" class="lane">接入端</text>
    <text x="84" y="356" class="lane">GO 控制面</text>
    <text x="84" y="674" class="lane">PI 运行时</text>
    <text x="84" y="1000" class="lane">外部服务</text>

    <!-- clients -->
    <g filter="url(#shadow)"><rect x="210" y="128" width="330" height="145" rx="18" fill="#FFF" stroke="#CBD5E1"/><rect x="635" y="128" width="330" height="145" rx="18" fill="#FFF" stroke="#CBD5E1"/><rect x="1060" y="128" width="330" height="145" rx="18" fill="#FFF" stroke="#CBD5E1"/></g>
    <circle cx="253" cy="171" r="22" fill="#DBEAFE"/><text x="253" y="178" text-anchor="middle" font-size="22">⚙</text><text x="290" y="166" class="title">后台管理端</text><text x="290" y="190" class="sub">管理员 · Vue 3 / Vben Admin</text><text x="242" y="228" class="item">用户、组、模型、Agent、工具管理</text><text x="242" y="252" class="item">授权、配额、用量与审计</text>
    <circle cx="678" cy="171" r="22" fill="#DCFCE7"/><text x="678" y="178" text-anchor="middle" font-size="20">☵</text><text x="715" y="166" class="title">用户对话前台</text><text x="715" y="190" class="sub">普通用户 · Open WebUI 风格</text><text x="667" y="228" class="item">授权模型 / Agent、多轮对话</text><text x="667" y="252" class="item">SSE 流式输出、历史会话</text>
    <circle cx="1103" cy="171" r="22" fill="#F3E8FF"/><text x="1103" y="178" text-anchor="middle" font-size="21">⌁</text><text x="1140" y="166" class="title">终端客户端</text><text x="1140" y="190" class="sub">用户 · CLI / TUI</text><text x="1092" y="228" class="item">登录、Agent 列表、流式任务</text><text x="1092" y="252" class="item">恢复会话、停止运行</text>
    <path d="M375 273 L375 309 L720 309 L720 336" class="line-blue"/><path d="M800 273 L800 336" class="line-blue"/><path d="M1225 273 L1225 309 L880 309 L880 336" class="line-blue"/><rect x="685" y="288" width="230" height="27" rx="13" fill="#EFF6FF"/><text x="800" y="306" text-anchor="middle" class="chip">HTTPS · REST · SSE</text>

    <!-- Go control plane -->
    <g filter="url(#shadow)"><rect x="210" y="338" width="1180" height="278" rx="22" fill="url(#control)"/></g>
    <text x="250" y="381" class="title-light">Simple Admin · Go 控制面（go-zero + goctl）</text><text x="250" y="407" class="sub-light">平台唯一权限事实源与 API 入口；通过 Runtime Manager 直接管理 Pi，不引入 Python Agent 服务</text>
    <g>
      <rect x="250" y="437" width="205" height="135" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".24"/><text x="270" y="469" class="title-light" font-size="17">身份与 RBAC</text><text x="270" y="497" class="item-light">用户 / 用户组 / 角色</text><text x="270" y="522" class="item-light">模型 / Agent / Tool 授权</text><text x="270" y="547" class="item-light">权限预览与即时吊销</text>
      <rect x="475" y="437" width="205" height="135" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".24"/><text x="495" y="469" class="title-light" font-size="17">资源目录</text><text x="495" y="497" class="item-light">Provider / Model</text><text x="495" y="522" class="item-light">Agent / Extension / MCP</text><text x="495" y="547" class="item-light">外部 RAG Connector</text>
      <rect x="700" y="437" width="220" height="135" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".24"/><text x="720" y="469" class="title-light" font-size="17">会话与 Runtime</text><text x="720" y="497" class="item-light">会话归属 / Session 映射</text><text x="720" y="522" class="item-light">Pi 进程池 / 超时 / 中止</text><text x="720" y="547" class="item-light">JSONL → SSE 事件转换</text>
      <rect x="940" y="437" width="190" height="135" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".24"/><text x="960" y="469" class="title-light" font-size="17">策略与密钥</text><text x="960" y="497" class="item-light">工具白名单 / 配额</text><text x="960" y="522" class="item-light">凭据引用 / 版本</text><text x="960" y="547" class="item-light">运行时短期票据</text>
      <rect x="1150" y="437" width="195" height="135" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".24"/><text x="1170" y="469" class="title-light" font-size="17">审计与观测</text><text x="1170" y="497" class="item-light">调用 / 工具 / 授权日志</text><text x="1170" y="522" class="item-light">Token / 时延 / 错误率</text><text x="1170" y="547" class="item-light">Trace ID 全链路关联</text>
    </g>

    <!-- DB -->
    <g filter="url(#shadow)"><rect x="1245" y="648" width="145" height="86" rx="16" fill="#FFF" stroke="#CBD5E1"/><rect x="1245" y="752" width="145" height="86" rx="16" fill="#FFF" stroke="#CBD5E1"/></g><text x="1317" y="681" text-anchor="middle" class="title" font-size="17">MySQL</text><text x="1317" y="706" text-anchor="middle" class="small">业务 / 会话映射</text><text x="1317" y="727" text-anchor="middle" class="small">用量 / 审计</text><text x="1317" y="785" text-anchor="middle" class="title" font-size="17">Redis</text><text x="1317" y="810" text-anchor="middle" class="small">缓存 / 限流</text><text x="1317" y="831" text-anchor="middle" class="small">租约 / 进程状态</text><path d="M1270 616 L1317 648" class="control-line"/><path d="M1200 616 L1200 795 L1245 795" class="control-line"/>

    <!-- Pi runtime -->
    <g filter="url(#shadow)"><rect x="210" y="652" width="970" height="250" rx="22" fill="url(#pi)"/></g>
    <text x="250" y="696" class="title-light">Pi Agent Runtime Pool · Node.js / TypeScript</text><text x="250" y="722" class="sub-light">Go Runtime Manager 通过严格 LF 分隔的 JSONL RPC 启停、恢复和观察会话</text>
    <rect x="250" y="752" width="205" height="110" rx="14" fill="#FFF" fill-opacity=".13"/><text x="270" y="783" class="title-light" font-size="17">Agent Session</text><text x="270" y="811" class="item-light">消息 / 分支 / 压缩</text><text x="270" y="836" class="item-light">流式事件 / Usage</text>
    <rect x="475" y="752" width="205" height="110" rx="14" fill="#FFF" fill-opacity=".13"/><text x="495" y="783" class="title-light" font-size="17">隔离与治理</text><text x="495" y="811" class="item-light">独立 cwd / session dir</text><text x="495" y="836" class="item-light">工具白名单 / 沙箱</text>
    <rect x="700" y="752" width="210" height="110" rx="14" fill="#FFF" fill-opacity=".13"/><text x="720" y="783" class="title-light" font-size="17">扩展能力</text><text x="720" y="811" class="item-light">Skills / Pi Packages</text><text x="720" y="836" class="item-light">registerTool / Event Hooks</text>
    <rect x="930" y="752" width="210" height="110" rx="14" fill="#FFF" fill-opacity=".13"/><text x="950" y="783" class="title-light" font-size="17">连接器</text><text x="950" y="811" class="item-light">MCP Client Extension</text><text x="950" y="836" class="item-light">HTTP / CLI Adapter</text>
    <path d="M810 616 L810 652" class="control-line"/><rect x="739" y="623" width="142" height="25" rx="12" fill="#F5F3FF"/><text x="810" y="640" text-anchor="middle" class="chip" fill="#5B21B6">JSONL RPC</text>

    <!-- external services -->
    <g filter="url(#shadow)"><rect x="210" y="976" width="300" height="130" rx="20" fill="#FFF" stroke="#A7F3D0" stroke-width="2"/><rect x="545" y="976" width="300" height="130" rx="20" fill="#FFF" stroke="#BFDBFE" stroke-width="2"/><rect x="880" y="976" width="510" height="130" rx="20" fill="#FFF" stroke="#C4B5FD" stroke-width="2"/></g>
    <circle cx="255" cy="1024" r="24" fill="#D1FAE5"/><text x="255" y="1031" text-anchor="middle" font-size="18" font-weight="700" fill="#047857">GLM</text><text x="295" y="1020" class="title">智谱 GLM</text><text x="295" y="1047" class="sub">OpenAI 兼容 / Provider API</text><text x="242" y="1080" class="small">模型推理 · 流式输出 · Tool Call</text>
    <circle cx="590" cy="1024" r="24" fill="#DBEAFE"/><text x="590" y="1030" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">DS</text><text x="630" y="1020" class="title">DeepSeek</text><text x="630" y="1047" class="sub">OpenAI 兼容 / Provider API</text><text x="577" y="1080" class="small">模型推理 · 流式输出 · Tool Call</text>
    <circle cx="925" cy="1024" r="24" fill="#EDE9FE"/><text x="925" y="1030" text-anchor="middle" font-size="16" font-weight="700" fill="#6D28D9">RAG</text><text x="965" y="1017" class="title">第三方 RAG / 工具平台（后续可选）</text><text x="965" y="1044" class="sub">Dify · RAGFlow · FastGPT · 其他 HTTP/MCP 服务</text><text x="913" y="1078" class="small">平台只做连接、授权、结果归一与审计，不自建检索引擎</text>

    <path d="M360 902 L360 976" class="line-blue"/><path d="M650 902 L650 976" class="line-blue"/><path d="M1035 902 L1035 943 L1135 943 L1135 976" class="line"/><rect x="724" y="916" width="255" height="27" rx="13" fill="#FFF" stroke="#CBD5E1"/><text x="851" y="934" text-anchor="middle" class="small">TLS · 服务端凭据 / 短期令牌</text>

    <!-- extension boundary -->
    <rect x="895" y="924" width="475" height="1" fill="#CBD5E1"/><text x="1378" y="930" text-anchor="end" class="small">扩展边界：按需接入，不属于 V1 强依赖</text>
    <rect x="210" y="1135" width="1180" height="1" fill="#CBD5E1"/><text x="210" y="1159" class="small">核心原则：Simple Admin 管身份与资源授权；Pi 管 Agent 会话与工具循环；所有扩展由管理员可信发布并按用户组授权。</text>
  </g>
</svg>
