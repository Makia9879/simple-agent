<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Agent Hub 分层架构</title>
  <desc id="desc">UI 层包含两套独立前端：会话 UI 供普通用户登录后进入 Open WebUI 风格对话；后台 UI 供管理员登录后进入管理页面。两者同属 UI 层，共同接入 Simple Admin 后端。Simple Admin 负责用户与用户组的模型授权和用量、用户会话查阅，以及登记 PI Agent 中已认证的模型提供商但不保存密钥。PI Agent 负责真正的模型对话并对接模型提供商。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="admin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <style>
      .font{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .h1{font-size:32px;font-weight:750;fill:#0F172A}
      .subtitle{font-size:16px;fill:#64748B}
      .lane{font-size:15px;font-weight:700;fill:#334155}
      .title{font-size:20px;font-weight:700;fill:#0F172A}
      .title-sm{font-size:17px;font-weight:700;fill:#FFF}
      .title-light{font-size:22px;font-weight:700;fill:#FFF}
      .sub{font-size:14px;fill:#64748B}
      .sub-light{font-size:14px;fill:#E0E7FF}
      .item{font-size:15px;fill:#334155}
      .item-light{font-size:15px;fill:#F8FAFC}
      .small{font-size:13px;fill:#64748B}
      .chip{font-size:12px;font-weight:700;fill:#1E3A8A}
      .step{font-size:13px;font-weight:700;fill:#334155}
      .line-blue{fill:none;stroke:#2563EB;stroke-width:2.4;marker-end:url(#arrowBlue)}
      .control-line{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1160" fill="url(#bg)"/>

  <g class="font">
    <text x="80" y="50" class="h1">Terminal Agent Hub · 分层架构</text>
    <text x="80" y="80" class="subtitle">同一 UI 层、两套前端：用户走会话 UI，管理员走后台 UI；后端仍是 Simple Admin + PI Agent</text>

    <g transform="translate(1148 38)">
      <line x1="0" y1="0" x2="44" y2="0" class="line-blue"/>
      <text x="56" y="5" class="small">对话 / 管理请求</text>
      <line x1="0" y1="24" x2="44" y2="24" class="control-line"/>
      <text x="56" y="29" class="small">提供商清单（不含密钥）</text>
    </g>

    <!-- 1 UI layer wrapper -->
    <text x="80" y="122" class="lane">1  UI 层</text>
    <text x="168" y="122" class="small">两套独立前端放在一起，入口和页面不同</text>

    <rect x="68" y="136" width="1464" height="248" rx="24" fill="#FFF" fill-opacity=".55" stroke="#E2E8F0"/>
    <rect x="88" y="148" width="88" height="22" rx="11" fill="#EEF2FF"/>
    <text x="132" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">同一层 · 两套 UI</text>

    <g filter="url(#shadow)">
      <rect x="92" y="180" width="668" height="184" rx="18" fill="#FFF" stroke="#BBF7D0" stroke-width="1.6"/>
      <rect x="92" y="180" width="8" height="184" rx="4" fill="#22C55E"/>
      <rect x="840" y="180" width="668" height="184" rx="18" fill="#FFF" stroke="#BFDBFE" stroke-width="1.6"/>
      <rect x="840" y="180" width="8" height="184" rx="4" fill="#2563EB"/>
    </g>

    <!-- 会话 UI -->
    <text x="120" y="214" class="title">会话 UI</text>
    <rect x="214" y="196" width="64" height="22" rx="11" fill="#DCFCE7"/>
    <text x="246" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">用户访问</text>
    <text x="120" y="238" class="sub">Open WebUI 风格 · Web Chat</text>

    <rect x="120" y="256" width="72" height="28" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="156" y="275" text-anchor="middle" class="step">1 登录</text>
    <path d="M198 270 L220 270" class="line-blue"/>
    <rect x="228" y="256" width="108" height="28" rx="8" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="282" y="275" text-anchor="middle" class="step">2 对话界面</text>

    <text x="120" y="314" class="item">用户先登录，再进入 AI 对话页面</text>
    <text x="120" y="338" class="item">使用已授权模型聊天，查看自己的用量</text>

    <!-- 后台 UI -->
    <text x="868" y="214" class="title">后台 UI</text>
    <rect x="958" y="196" width="88" height="22" rx="11" fill="#DBEAFE"/>
    <text x="1002" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">管理员访问</text>
    <text x="868" y="238" class="sub">常规管理后台 · 管理页面</text>

    <rect x="868" y="256" width="72" height="28" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="904" y="275" text-anchor="middle" class="step">1 登录</text>
    <path d="M946 270 L968 270" class="line-blue"/>
    <rect x="976" y="256" width="108" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="1030" y="275" text-anchor="middle" class="step">2 管理页面</text>

    <text x="868" y="314" class="item">管理员先登录，再进入正常管理页面</text>
    <text x="868" y="338" class="item">管用户 / 组 / 模型授权，查阅会话与提供商</text>

    <path d="M426 364 L426 400" class="line-blue"/>
    <path d="M1174 364 L1174 400" class="line-blue"/>
    <rect x="352" y="372" width="148" height="24" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="426" y="389" text-anchor="middle" class="chip" fill="#166534">用户登录后对话</text>
    <rect x="1094" y="372" width="160" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="1174" y="389" text-anchor="middle" class="chip">管理员登录后管理</text>

    <!-- 2 Simple Admin -->
    <text x="80" y="440" class="lane">2  Simple Admin 后端</text>
    <text x="248" y="440" class="small">两套 UI 共用这一层；不保存模型提供商的真正密钥</text>

    <g filter="url(#shadow)">
      <rect x="80" y="456" width="1440" height="250" rx="22" fill="url(#admin)"/>
    </g>
    <text x="112" y="492" class="title-light">Simple Admin</text>
    <text x="112" y="518" class="sub-light">给会话 UI 做登录、授权模型和对话；给后台 UI 做管理和查阅</text>

    <rect x="112" y="540" width="440" height="140" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".22"/>
    <text x="132" y="572" class="title-sm">用户管理 · RBAC</text>
    <text x="132" y="602" class="item-light">主体：用户、用户组</text>
    <text x="132" y="628" class="item-light">资源：模型，以及该模型的用量</text>
    <text x="132" y="654" class="item-light">按组把模型使用权分给用户</text>

    <rect x="572" y="540" width="440" height="140" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".22"/>
    <text x="592" y="572" class="title-sm">用户会话</text>
    <text x="592" y="602" class="item-light">记录用户在会话 UI 里发起了哪些对话</text>
    <text x="592" y="628" class="item-light">管理员在后台 UI 可阅读会话具体内容</text>
    <text x="592" y="654" class="item-light">会话归属到用户和所用模型</text>

    <rect x="1032" y="540" width="456" height="140" rx="14" fill="#FFF" fill-opacity=".12" stroke="#FFF" stroke-opacity=".30" stroke-dasharray="7 5"/>
    <text x="1052" y="572" class="title-sm">提供商登记 · 无密钥</text>
    <text x="1052" y="602" class="item-light">不保存 API Key</text>
    <text x="1052" y="628" class="item-light">只记录 PI Agent 里已经认证的提供商</text>
    <text x="1052" y="654" class="item-light">在后台 UI 告知管理员当前可用哪些</text>

    <path d="M792 706 L792 734 L800 734 L800 762" class="line-blue"/>
    <path d="M1260 706 L1260 734 L1100 734 L1100 762" class="control-line"/>
    <rect x="678" y="720" width="168" height="24" rx="12" fill="#EFF6FF"/>
    <text x="762" y="737" text-anchor="middle" class="chip">发起 / 恢复对话</text>
    <rect x="1118" y="720" width="188" height="24" rx="12" fill="#FFF" stroke="#CBD5E1"/>
    <text x="1212" y="737" text-anchor="middle" class="small">查询已认证提供商</text>

    <!-- 3 PI Agent -->
    <text x="80" y="800" class="lane">3  PI Agent 层</text>
    <text x="200" y="800" class="small">真正跟模型对话；密钥只在这里</text>

    <g filter="url(#shadow)">
      <rect x="80" y="816" width="1440" height="148" rx="22" fill="url(#pi)"/>
    </g>
    <text x="112" y="854" class="title-light">PI Agent</text>
    <text x="112" y="880" class="sub-light">执行对话过程，并对接模型提供商</text>

    <rect x="112" y="896" width="440" height="44" rx="12" fill="#FFF" fill-opacity=".14"/>
    <text x="332" y="924" text-anchor="middle" class="item-light">多轮对话 / 流式输出</text>
    <rect x="572" y="896" width="440" height="44" rx="12" fill="#FFF" fill-opacity=".14"/>
    <text x="792" y="924" text-anchor="middle" class="item-light">对接 GLM / DeepSeek</text>
    <rect x="1032" y="896" width="456" height="44" rx="12" fill="#FFF" fill-opacity=".14"/>
    <text x="1260" y="924" text-anchor="middle" class="item-light">持有并使用 Provider Key</text>

    <path d="M420 964 L420 994" class="line-blue"/>
    <path d="M1180 964 L1180 994" class="line-blue"/>
    <rect x="686" y="968" width="228" height="24" rx="12" fill="#FFF" stroke="#CBD5E1"/>
    <text x="800" y="985" text-anchor="middle" class="small">TLS · 凭据留在 PI Agent</text>

    <!-- providers -->
    <text x="80" y="1032" class="lane">模型提供商</text>

    <g filter="url(#shadow)">
      <rect x="80" y="1048" width="680" height="56" rx="16" fill="#FFF" stroke="#A7F3D0" stroke-width="2"/>
      <rect x="840" y="1048" width="680" height="56" rx="16" fill="#FFF" stroke="#BFDBFE" stroke-width="2"/>
    </g>
    <text x="420" y="1083" text-anchor="middle" class="title" font-size="18">智谱 GLM</text>
    <text x="1180" y="1083" text-anchor="middle" class="title" font-size="18">DeepSeek</text>

    <text x="80" y="1136" class="small">业务：用户登录会话 UI 去聊天；管理员登录后台 UI 去管理。分发的是模型使用权，密钥留在 PI Agent。</text>
  </g>
</svg>
